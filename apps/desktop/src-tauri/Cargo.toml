[package]
name = "goalos-desktop"
version = "0.1.0"
description = "GoalOS native desktop client"
authors = ["Samuel"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "goalos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
